apiVersion: batch/v1
kind: CronJob
metadata:
  name: expired-supplier-cleanup
  namespace: krafton-bid
spec:
  schedule: "10 18 * * *"
  timeZone: Asia/Seoul
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: expired-supplier-cleanup
        spec:
          serviceAccountName: krafton-bid-api
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: postgres:16-alpine
              command: ["/bin/sh", "-lc"]
              args:
                - |
                  PGPASSWORD="${DATABASE_PASSWORD}" psql \
                    --host="${DATABASE_HOST}" \
                    --port="${DATABASE_PORT:-5432}" \
                    --dbname="${DATABASE_NAME}" \
                    --username="${DATABASE_USER}" \
                    --set=ON_ERROR_STOP=1 \
                    --command="select * from mark_expired_supplier_accounts_deleted();"
              env:
                - name: AWS_REGION
                  value: ap-northeast-2
                - name: DATABASE_ENGINE
                  value: AWS PostgreSQL
                - name: SUPPLIER_LOGIN_TTL_DAYS
                  value: "14"
                - name: DATABASE_HOST
                  valueFrom:
                    secretKeyRef:
                      name: krafton-bid-postgresql
                      key: host
                - name: DATABASE_NAME
                  valueFrom:
                    secretKeyRef:
                      name: krafton-bid-postgresql
                      key: database
                - name: DATABASE_USER
                  valueFrom:
                    secretKeyRef:
                      name: krafton-bid-postgresql
                      key: username
                - name: DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: krafton-bid-postgresql
                      key: password
