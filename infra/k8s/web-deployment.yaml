apiVersion: apps/v1
kind: Deployment
metadata:
  name: krafton-bid-web
  namespace: krafton-bid
  labels:
    app.kubernetes.io/name: krafton-bid-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: krafton-bid-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: krafton-bid-web
    spec:
      containers:
        - name: web
          image: ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/krafton-bid-web:latest
          command: ["node", "scripts/start-server.mjs"]
          ports:
            - containerPort: 8080
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8080"
            - name: VITE_BID_API_BASE_URL
              value: https://bid-api.example.com
            - name: VITE_OPERATOR_LOGIN_REVIEW_MODE
              value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: krafton-bid-web
  namespace: krafton-bid
spec:
  selector:
    app.kubernetes.io/name: krafton-bid-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
